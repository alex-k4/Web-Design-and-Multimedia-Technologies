<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Вход - Game Forge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header>
    <div class="logo-container">
        <img src="images/logo.png" class="logo">
        <h1 class="bungee-regular">Game Forge</h1>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Начало</a></li>
            <li><a href="tailwind.html">Готови модели</a></li>
            <li><a href="bootstrap.html">Създайте игра</a></li>
            <li><a href="about.html">За нас</a></li>
            <li><a href="contacts.html">Контакти</a></li>
        </ul>
    </nav>

    <div class="cart-container">
        <a href="login.html" class="auth-btn active">Вход</a>
        <a href="register.html" class="auth-btn">Регистрация</a>
        <button id="cart-button" class="cart-button">
            <img src="images/icon_basket.gif" class="cart-icon" alt="Cart">
            <span class="cart-text">Кошница</span>
            (<span id="cart-count">0</span>)
        </button>
    </div>
</header>

<section class="auth-section">
    <div class="auth-container">
        <h2>Вход в акаунта</h2>
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="login-email">Имейл:</label>
                <input type="email" id="login-email" name="email" required placeholder="вашия@имейл.com">
            </div>

            <div class="form-group">
                <label for="login-password">Парола:</label>
                <input type="password" id="login-password" name="password" required placeholder="Введите парола">
            </div>

            <button type="submit" class="auth-submit">Вход</button>
        </form>

        <div id="profile-view" class="auth-container hidden"></div>

        <p class="auth-link" id="login-navigation">
            Нямаш акаунт? <a href="register.html">Регистрирай се тук</a>
        </p>
    </div>
</section>

<footer>
    <p>&copy; 2026 Game Forge. All rights reserved.</p>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/script.js"></script>
<script>
$(document).ready(function() {
    function renderProfile(user) {
        const orders = JSON.parse(localStorage.getItem('userOrders') || '[]');
        const personalizations = JSON.parse(localStorage.getItem('personalizations') || '[]');
        const avatar = localStorage.getItem('profileAvatar');
        const avatarHtml = avatar ? `<img src="${avatar}" class="profile-avatar" alt="Аватар">` : `<div class="profile-avatar placeholder">Аватар</div>`;

        $('#login-form').addClass('hidden');
        $('#login-navigation').addClass('hidden');
        $('#profile-view').removeClass('hidden').html(`
            <div class="profile-card">
                <div class="profile-header">
                    ${avatarHtml}
                    <div class="profile-details">
                        <p><strong>Имейл:</strong> ${user.email}</p>
                        <p><strong>Последно влизане:</strong> ${user.loginTime || user.registrationTime}</p>
                    </div>
                </div>
                <div class="form-group">
                    <label for="avatar-upload">Качи аватар</label>
                    <input type="file" id="avatar-upload" accept="image/*">
                </div>
                <button class="profile-logout" id="logout-button">Излез от профила</button>
                        <div class="profile-orders">
                            <h4>История на поръчките</h4>
                            <ul>
                                ${orders.length ? orders.map(order => `<li><strong>${order.date}</strong><br>${order.items.length} артикула · ${order.total} лв.<br>${order.deliveryType}</li>`).join('') : '<li>Все още нямате поръчки.</li>'}
                            </ul>
                        </div>
                        <div class="profile-orders">
                            <h4>Запазени персонализации</h4>
                            <ul>
                                ${personalizations.length ? personalizations.map(item => `<li><strong>${item.name}</strong><br>Цвят: ${item.color || '—'}<br>Герои: ${item.characters || '—'}<br>Контакт: ${item.contact || 'не е добавен'}</li>`).join('') : '<li>Все още нямате запазена персонализация.</li>'}
                            </ul>
                        </div>
                        <div class="profile-orders">
                            <h4>Моите заявки за създаване на игри</h4>
                            <ul>
                                ${(() => {
                                    const reqs = JSON.parse(localStorage.getItem('gameRequests') || '[]');
                                    const userReqs = reqs.filter(r => !user.email || r.user === user.email || r.user === user.name);
                                    return userReqs.length ? userReqs.map(r => `<li><strong>${r.name}</strong><br>Статус: ${r.status}<br>Дата: ${r.createdAt}</li>`).join('') : '<li>Нямате текущи заявки.</li>';
                                })()}
                            </ul>
                        </div>
            </div>
        `);

        $('#avatar-upload').change(function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('profileAvatar', e.target.result);
                renderProfile(user);
            };
            reader.readAsDataURL(file);
        });

        $('#logout-button').click(function() {
            localStorage.removeItem('loggedInUser');
            window.location.reload();
        });
    }

    const storedUser = JSON.parse(localStorage.getItem('loggedInUser') || 'null');
    if (storedUser) {
        renderProfile(storedUser);
    }

    $("#login-form").submit(function(e) {
        e.preventDefault();
        
        const email = $("#login-email").val();
        const password = $("#login-password").val();
        
        if (email && password) {
            localStorage.setItem('loggedInUser', JSON.stringify({
                email: email,
                loginTime: new Date().toLocaleString()
            }));
            
            alert("Успешно влязъл в акаунта!");
            window.location.href = "index.html";
        } else {
            alert("Моля, попълнете всички полета!");
        }
    });
});
</script>

</body>
</html>
