<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - Game Forge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header>
    <div class="logo-container">
        <img src="images/logo.png" class="logo">
        <h1 class="bungee-regular">Game Forge</h1>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Начало</a></li>
            <li><a href="tailwind.html">Готови модели</a></li>
            <li><a href="bootstrap.html">Създайте игра</a></li>
            <li><a href="about.html">За нас</a></li>
            <li><a href="contacts.html">Контакти</a></li>
        </ul>
    </nav>

    <div class="cart-container">
        <a href="login.html" class="auth-btn">Вход</a>
        <a href="register.html" class="auth-btn active">Регистрация</a>
        <button id="cart-button" class="cart-button">
            <img src="images/icon_basket.gif" class="cart-icon" alt="Cart">
            <span class="cart-text">Кошница</span>
            (<span id="cart-count">0</span>)
        </button>
    </div>
</header>

<section class="auth-section">
    <div class="auth-container">
        <h2>Регистрирай се</h2>
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="register-name">Пълно име:</label>
                <input type="text" id="register-name" name="name" required placeholder="Твоето име">
            </div>

            <div class="form-group">
                <label for="register-email">Имейл:</label>
                <input type="email" id="register-email" name="email" required placeholder="вашия@имейл.com">
            </div>

            <div class="form-group">
                <label for="register-password">Парола:</label>
                <input type="password" id="register-password" name="password" required placeholder="Введите парола">
            </div>

            <div class="form-group">
                <label for="register-confirm">Повтори парола:</label>
                <input type="password" id="register-confirm" name="confirm" required placeholder="Повтори парола">
            </div>

            <button type="submit" class="auth-submit">Регистрирай се</button>
        </form>

        <p class="auth-link">
            Вече имаш акаунт? <a href="login.html">Влез тук</a>
        </p>
    </div>
</section>

<footer>
    <p>&copy; 2026 Game Forge. All rights reserved.</p>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/script.js"></script>
<script>
$(document).ready(function() {
    $("#register-form").submit(function(e) {
        e.preventDefault();
        
        const name = $("#register-name").val();
        const email = $("#register-email").val();
        const password = $("#register-password").val();
        const confirm = $("#register-confirm").val();
        
        if (password !== confirm) {
            alert("Паролите не съвпадат!");
            return;
        }

        if (name && email && password) {
            localStorage.setItem('loggedInUser', JSON.stringify({
                name: name,
                email: email,
                registrationTime: new Date().toLocaleString()
            }));
            
            alert("Успешна регистрация!");
            window.location.href = "index.html";
        } else {
            alert("Моля, попълнете всички полета!");
        }
    });
});
</script>

</body>
</html>
