<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Кошница - Game Forge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header>
    <div class="logo-container">
        <img src="images/logo.png" class="logo">
        <h1 class="bungee-regular">Game Forge</h1>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Начало</a></li>
            <li><a href="tailwind.html">Готови модели</a></li>
            <li><a href="bootstrap.html">Създайте игра</a></li>
            <li><a href="about.html">За нас</a></li>
            <li><a href="contacts.html">Контакти</a></li>
        </ul>
    </nav>

    <div class="cart-container">
        <a href="login.html" class="auth-btn">Вход</a>
        <a href="register.html" class="auth-btn">Регистрация</a>
        <button id="cart-button" class="cart-button">
            <img src="images/icon_basket.gif" class="cart-icon" alt="Cart">
            <span class="cart-text">Кошница</span>
            (<span id="cart-count">0</span>)
        </button>
    </div>
</header>

<!-- CART PAGE -->
<section class="cart-section">
    <div class="cart-container-page">
        <h2>Моята кошница</h2>
        
        <div class="cart-items-list" id="cart-items">
            <!-- Артикули ще се показват тук -->
        </div>

        <div class="cart-summary" id="cart-summary">
            <div class="cart-total">
                <strong>Общо:</strong>
                <span id="total-price">0 лв.</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Поръчай сега</button>
            <a href="index.html" class="continue-shopping">Продължи пазаруване</a>
        </div>
    </div>
</section>

<footer>
    <p>&copy; 2026 Game Forge. All rights reserved.</p>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
